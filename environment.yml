# Package versions that produced the paper's numbers (built on macOS arm64 from the Anaconda "defaults" channel).
name: threshold-transfer
channels:
  - defaults
dependencies:
  - python=3.13.5
  - numpy=2.1.3
  - scipy=1.15.3
  - numba=0.61.0
  - llvmlite=0.44.0
  - scikit-learn=1.6.1
  - joblib=1.4.2
  - threadpoolctl=3.5.0
  - matplotlib-base=3.10.0
  - freetype=2.13.3
  - contourpy=1.3.1
  - fonttools=4.55.3
  - kiwisolver=1.4.8
  - pillow=11.1.0
  - pytest=8.3.4
